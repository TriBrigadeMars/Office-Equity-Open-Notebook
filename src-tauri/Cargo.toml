[package]
name = "office-equity-host-tauri"
version = "1.0.0"
description = "A minimal Tauri host candidate"
authors = ["Office of Equity"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "window-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.29"
reqwest = { version = "0.11", features = ["blocking", "json"] }
winapi = { version = "0.3.9", features = ["jobapi2", "processthreadsapi", "handleapi", "minwindef"] }
